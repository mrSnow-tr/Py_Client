[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/py_client"]

[project]
name = "py_client"
version = "0.1.0"
description = "Production-grade WebSocket relay client for py_relay"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["websocket", "relay", "networking", "asyncio"]

dependencies = [
    "websockets>=10.0,<12.0",
    "python-dotenv>=1.0",
]

[project.scripts]
py-client = "py_client.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires a live py_relay instance",
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
